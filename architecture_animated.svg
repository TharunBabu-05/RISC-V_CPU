<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RISC-V RV32IM FPGA SoC Architecture</title>
  <desc id="desc">Architecture presentation for a five-stage pipelined RV32IM CPU with BRAM, UART, firmware, forwarding, CSR, and FPGA deployment blocks.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050718"/>
      <stop offset="48%" stop-color="#08142d"/>
      <stop offset="100%" stop-color="#12091f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#1ee7ff" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#7b3cff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stage-if" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3b8d"/>
      <stop offset="100%" stop-color="#7c1558"/>
    </linearGradient>
    <linearGradient id="stage-id" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8e5cff"/>
      <stop offset="100%" stop-color="#321d8f"/>
    </linearGradient>
    <linearGradient id="stage-ex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12d9ff"/>
      <stop offset="100%" stop-color="#085fbc"/>
    </linearGradient>
    <linearGradient id="stage-mem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34f27a"/>
      <stop offset="100%" stop-color="#0b7f55"/>
    </linearGradient>
    <linearGradient id="stage-wb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc24a"/>
      <stop offset="100%" stop-color="#c36b00"/>
    </linearGradient>
    <linearGradient id="soc-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10233f"/>
      <stop offset="50%" stop-color="#152b52"/>
      <stop offset="100%" stop-color="#26183e"/>
    </linearGradient>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#4ef7ff"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#ff4df3"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#61ff93"/>
    </marker>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.045"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: Orbitron, Rajdhani, Segoe UI, Arial, sans-serif;
      font-size: 35px;
      font-weight: 800;
      letter-spacing: 1.5px;
      fill: #f7fbff;
      text-anchor: middle;
    }
    .subtitle {
      font-family: Segoe UI, Arial, sans-serif;
      font-size: 15px;
      fill: #b8d8ff;
      text-anchor: middle;
      letter-spacing: 0.8px;
    }
    .chip-text {
      font-family: Segoe UI, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #eaf7ff;
      text-anchor: middle;
    }
    .stage-name {
      font-family: Orbitron, Rajdhani, Segoe UI, Arial, sans-serif;
      font-size: 21px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: 1px;
    }
    .stage-code {
      font-family: Fira Code, Consolas, monospace;
      font-size: 13px;
      fill: #d7efff;
      text-anchor: middle;
    }
    .module-label {
      font-family: Fira Code, Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #ffffff;
      text-anchor: middle;
    }
    .module-note {
      font-family: Segoe UI, Arial, sans-serif;
      font-size: 11px;
      fill: #d3e8ff;
      text-anchor: middle;
    }
    .section-title {
      font-family: Orbitron, Rajdhani, Segoe UI, Arial, sans-serif;
      font-size: 18px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: 1px;
    }
    .small {
      font-family: Segoe UI, Arial, sans-serif;
      font-size: 12px;
      fill: #bcd4ef;
      text-anchor: middle;
    }
    .panel {
      stroke: rgba(255,255,255,0.24);
      stroke-width: 1.5;
      filter: url(#panel-shadow);
    }
    .stage-card {
      stroke: rgba(255,255,255,0.32);
      stroke-width: 1.6;
      filter: url(#panel-shadow);
    }
    .module-box {
      fill: rgba(5, 12, 31, 0.58);
      stroke: rgba(255,255,255,0.32);
      stroke-width: 1.1;
    }
    .flow {
      fill: none;
      stroke: #4ef7ff;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrow-cyan);
      filter: url(#soft-glow);
      stroke-dasharray: 12 10;
      animation: dashForward 1.35s linear infinite;
    }
    .control-flow {
      fill: none;
      stroke: #ff4df3;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrow-pink);
      filter: url(#soft-glow);
      stroke-dasharray: 10 9;
      animation: dashReverse 1.5s linear infinite;
    }
    .soc-flow {
      fill: none;
      stroke: #61ff93;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrow-green);
      filter: url(#soft-glow);
      stroke-dasharray: 10 8;
      animation: dashForward 1.25s linear infinite;
    }
    .static-wire {
      fill: none;
      stroke: rgba(180, 215, 255, 0.42);
      stroke-width: 1.2;
      stroke-linecap: round;
    }
    .spark {
      animation: pulse 1.8s ease-in-out infinite alternate;
      transform-origin: center;
    }
    @keyframes dashForward { to { stroke-dashoffset: -22; } }
    @keyframes dashReverse { to { stroke-dashoffset: 19; } }
    @keyframes pulse {
      from { opacity: 0.55; }
      to { opacity: 1; }
    }
  </style>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="28" fill="url(#halo)"/>
  <rect width="1200" height="760" rx="28" fill="url(#grid)"/>
  <rect x="10" y="10" width="1180" height="740" rx="24" fill="none" stroke="#26395f" stroke-width="2"/>
  <rect x="18" y="18" width="1164" height="724" rx="20" fill="none" stroke="#40e7ff" stroke-opacity="0.18" stroke-width="1.2"/>

  <text x="600" y="54" class="title">RISC-V RV32IM 5-STAGE PIPELINED SoC</text>
  <text x="600" y="82" class="subtitle">Custom 32-bit CPU on Arty S7-50 - 64KB BRAM - UART firmware - Snake game verified in PuTTY</text>

  <g>
    <rect x="250" y="104" width="128" height="28" rx="14" fill="#0f2748" stroke="#37e8ff" stroke-opacity="0.55"/>
    <text x="314" y="123" class="chip-text">RV32IM ISA</text>
    <rect x="394" y="104" width="136" height="28" rx="14" fill="#221346" stroke="#aa7cff" stroke-opacity="0.65"/>
    <text x="462" y="123" class="chip-text">Hazard + FWD</text>
    <rect x="546" y="104" width="122" height="28" rx="14" fill="#0e3a28" stroke="#55ff91" stroke-opacity="0.65"/>
    <text x="607" y="123" class="chip-text">25 MHz FPGA</text>
    <rect x="684" y="104" width="142" height="28" rx="14" fill="#3e2410" stroke="#ffbf4d" stroke-opacity="0.7"/>
    <text x="755" y="123" class="chip-text">115200 UART</text>
  </g>

  <path d="M 998 151 H 278 V 181" class="control-flow"/>
  <text x="638" y="144" class="small" fill="#ffcdfb">writeback / branch recovery lane</text>

  <path d="M 590 398 V 436 H 276 V 390" class="control-flow"/>
  <text x="433" y="454" class="small" fill="#ffd1fb">EX/MEM forwarding lane</text>

  <g id="pipeline">
    <g transform="translate(38 170)">
      <rect width="196" height="230" rx="18" fill="url(#stage-if)" class="stage-card"/>
      <rect x="8" y="8" width="180" height="214" rx="14" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.18)"/>
      <circle cx="33" cy="33" r="18" fill="#ffffff" fill-opacity="0.14"/>
      <path d="M 25 33 H 39 M 33 25 V 41" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
      <text x="98" y="39" class="stage-name">FETCH</text>
      <text x="98" y="63" class="stage-code">IF stage</text>
      <rect x="24" y="82" width="148" height="42" rx="10" class="module-box"/>
      <text x="98" y="108" class="module-label">PC + Next PC</text>
      <rect x="24" y="137" width="148" height="42" rx="10" class="module-box"/>
      <text x="98" y="163" class="module-label">Branch Predict</text>
      <rect x="24" y="190" width="148" height="28" rx="9" fill="#071127" stroke="#ff8fbc" stroke-opacity="0.5"/>
      <text x="98" y="209" class="module-note">BRAM Port A fetch</text>
    </g>

    <g transform="translate(268 170)">
      <rect width="196" height="230" rx="18" fill="url(#stage-id)" class="stage-card"/>
      <rect x="8" y="8" width="180" height="214" rx="14" fill="rgba(0,0,0,0.16)" stroke="rgba(255,255,255,0.18)"/>
      <circle cx="33" cy="33" r="18" fill="#ffffff" fill-opacity="0.14"/>
      <path d="M 24 29 H 42 M 24 36 H 42" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
      <text x="98" y="39" class="stage-name">DECODE</text>
      <text x="98" y="63" class="stage-code">ID stage</text>
      <rect x="24" y="82" width="148" height="42" rx="10" class="module-box"/>
      <text x="98" y="108" class="module-label">Control Unit</text>
      <rect x="24" y="137" width="148" height="42" rx="10" class="module-box"/>
      <text x="98" y="163" class="module-label">Regfile 32x32</text>
      <rect x="24" y="190" width="148" height="28" rx="9" fill="#071127" stroke="#b495ff" stroke-opacity="0.55"/>
      <text x="98" y="209" class="module-note">imm_gen + hazard</text>
    </g>

    <g transform="translate(498 170)">
      <rect width="196" height="230" rx="18" fill="url(#stage-ex)" class="stage-card"/>
      <rect x="8" y="8" width="180" height="214" rx="14" fill="rgba(0,0,0,0.16)" stroke="rgba(255,255,255,0.2)"/>
      <circle cx="33" cy="33" r="18" fill="#ffffff" fill-opacity="0.14"/>
      <path d="M 25 40 L 33 25 L 41 40 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="98" y="39" class="stage-name">EXECUTE</text>
      <text x="98" y="63" class="stage-code">EX stage</text>
      <rect x="24" y="82" width="148" height="48" rx="10" class="module-box spark"/>
      <text x="98" y="111" class="module-label">ALU + Branch</text>
      <rect x="24" y="143" width="148" height="42" rx="10" class="module-box"/>
      <text x="98" y="169" class="module-label">MUL / DIV</text>
      <rect x="24" y="196" width="148" height="28" rx="9" fill="#071127" stroke="#5ceeff" stroke-opacity="0.58"/>
      <text x="98" y="215" class="module-note">forward select</text>
    </g>

    <g transform="translate(728 170)">
      <rect width="196" height="230" rx="18" fill="url(#stage-mem)" class="stage-card"/>
      <rect x="8" y="8" width="180" height="214" rx="14" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.18)"/>
      <circle cx="33" cy="33" r="18" fill="#ffffff" fill-opacity="0.14"/>
      <path d="M 24 30 H 42 V 40 H 24 Z M 28 30 V 24 M 38 30 V 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
      <text x="98" y="39" class="stage-name">MEMORY</text>
      <text x="98" y="63" class="stage-code">MEM stage</text>
      <rect x="24" y="82" width="148" height="42" rx="10" class="module-box"/>
      <text x="98" y="108" class="module-label">Load / Store</text>
      <rect x="24" y="137" width="148" height="42" rx="10" class="module-box"/>
      <text x="98" y="163" class="module-label">Byte Align</text>
      <rect x="24" y="190" width="148" height="28" rx="9" fill="#071127" stroke="#6fff9c" stroke-opacity="0.55"/>
      <text x="98" y="209" class="module-note">BRAM/UART mux</text>
    </g>

    <g transform="translate(958 170)">
      <rect width="196" height="230" rx="18" fill="url(#stage-wb)" class="stage-card"/>
      <rect x="8" y="8" width="180" height="214" rx="14" fill="rgba(0,0,0,0.16)" stroke="rgba(255,255,255,0.2)"/>
      <circle cx="33" cy="33" r="18" fill="#ffffff" fill-opacity="0.14"/>
      <path d="M 25 25 H 41 V 41 H 25 Z M 29 33 H 37" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
      <text x="98" y="39" class="stage-name">WRITEBACK</text>
      <text x="98" y="63" class="stage-code">WB stage</text>
      <rect x="24" y="90" width="148" height="46" rx="10" class="module-box"/>
      <text x="98" y="119" class="module-label">WB Mux</text>
      <rect x="24" y="151" width="148" height="42" rx="10" class="module-box"/>
      <text x="98" y="177" class="module-label">rd Commit</text>
      <rect x="24" y="204" width="148" height="20" rx="8" fill="#071127" stroke="#ffd06b" stroke-opacity="0.55"/>
      <text x="98" y="219" class="module-note">retire</text>
    </g>
  </g>

  <path d="M 234 285 H 268" class="flow"/>
  <path d="M 464 285 H 498" class="flow"/>
  <path d="M 694 285 H 728" class="flow"/>
  <path d="M 924 285 H 958" class="flow"/>
  <text x="251" y="271" class="small">IF/ID</text>
  <text x="481" y="271" class="small">ID/EX</text>
  <text x="711" y="271" class="small">EX/MEM</text>
  <text x="941" y="271" class="small">MEM/WB</text>

  <g transform="translate(48 500)">
    <rect width="1104" height="196" rx="22" fill="url(#soc-grad)" class="panel"/>
    <rect x="18" y="18" width="1068" height="160" rx="16" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.16)"/>
    <text x="552" y="43" class="section-title">FPGA SYSTEM FABRIC</text>
    <text x="552" y="66" class="small">Arty S7-50 deployment - unified memory - memory-mapped UART - firmware boot image</text>
    <path d="M 108 104 H 996" class="soc-flow"/>
    <text x="552" y="94" class="small" fill="#c8ffdc">32-bit SoC data bus / address decode</text>

    <g transform="translate(54 118)">
      <rect width="190" height="54" rx="13" fill="#08142d" stroke="#5ffbff" stroke-opacity="0.6"/>
      <path d="M 22 15 H 44 V 39 H 22 Z M 18 20 H 10 M 18 28 H 10 M 18 36 H 10 M 48 20 H 56 M 48 28 H 56 M 48 36 H 56" fill="none" stroke="#5ffbff" stroke-width="2" stroke-linecap="round"/>
      <text x="118" y="24" class="module-label">64KB BRAM</text>
      <text x="118" y="42" class="module-note">firmware + data</text>
    </g>
    <g transform="translate(318 118)">
      <rect width="190" height="54" rx="13" fill="#08142d" stroke="#ffcc64" stroke-opacity="0.65"/>
      <path d="M 20 17 H 53 V 37 H 20 Z M 53 26 H 62 M 26 41 H 47" fill="none" stroke="#ffcc64" stroke-width="2" stroke-linecap="round"/>
      <text x="122" y="24" class="module-label">UART TX/RX</text>
      <text x="122" y="42" class="module-note">0x1000_0000</text>
    </g>
    <g transform="translate(582 118)">
      <rect width="190" height="54" rx="13" fill="#08142d" stroke="#c99cff" stroke-opacity="0.65"/>
      <circle cx="36" cy="27" r="14" fill="none" stroke="#c99cff" stroke-width="2"/>
      <path d="M 36 13 V 27 L 48 34" fill="none" stroke="#c99cff" stroke-width="2" stroke-linecap="round"/>
      <text x="122" y="24" class="module-label">MMCM Clock</text>
      <text x="122" y="42" class="module-note">12 MHz to 25 MHz</text>
    </g>
    <g transform="translate(846 118)">
      <rect width="190" height="54" rx="13" fill="#08142d" stroke="#61ff93" stroke-opacity="0.65"/>
      <path d="M 22 37 C 28 20 45 15 60 23 M 22 37 C 36 30 48 32 60 23" fill="none" stroke="#61ff93" stroke-width="2" stroke-linecap="round"/>
      <text x="122" y="24" class="module-label">Snake FW</text>
      <text x="122" y="42" class="module-note">bare-metal C</text>
    </g>
  </g>

  <path d="M 136 400 V 482 H 152 V 604" class="soc-flow"/>
  <text x="110" y="445" class="small">fetch</text>
  <path d="M 826 400 V 482 H 430 V 604" class="soc-flow"/>
  <text x="878" y="445" class="small">load/store</text>
  <path d="M 826 400 V 468 H 434" class="static-wire"/>
  <text x="637" y="461" class="small">UART status / RX / TX</text>

  <g transform="translate(74 706)">
    <rect width="1052" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="128" y="21" class="chip-text">Byte loads/stores fixed</text>
    <text x="348" y="21" class="chip-text">CSR + interrupt architecture</text>
    <text x="590" y="21" class="chip-text">M-extension datapath</text>
    <text x="802" y="21" class="chip-text">FPGA UART verified</text>
    <text x="980" y="21" class="chip-text">Snake running</text>
  </g>
</svg>
