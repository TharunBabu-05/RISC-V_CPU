# riscv-formal configuration for the FPGA SoC core (cpu_top_soc, RV32IM + Zicsr).
# run_riscv_formal.py replaces @rtl@ with the absolute path of riscv_processor_cpu/ and
# @wrapper@ with the installed copy of wrapper.sv.

[options]
isa rv32im
nret 1
solver boolector

[depth]
insn            20
reg       15    25
pc_fwd    10    30
pc_bwd    10    30
unique    1  10 30
causal    10    30
ill             20
cover     1     15

[sort]
reg_ch0

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS
`define RISCV_FORMAL_UMODE

[script-link]
async2sync

[verilog-files]
@wrapper@
@rtl@/phase8/rtl/cpu_top_soc.sv
@rtl@/rtl/alu.sv
@rtl@/rtl/branch_predictor.sv
@rtl@/rtl/control_unit.sv
@rtl@/rtl/csr_file.sv
@rtl@/rtl/hazard.sv
@rtl@/rtl/imm_gen.sv
@rtl@/rtl/interrupt_unit.sv
@rtl@/rtl/pmp_unit.sv
@rtl@/rtl/regfile.sv
@rtl@/rtl/muldiv.sv

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
